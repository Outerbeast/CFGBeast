[package]
name = "CFGBeast"
version = "3.0.0"
authors = ["Outerbeast"]
edition = "2024"
description = "CFGBeast Map Configurator"

[dependencies]
slint = { version = "1.17.1", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-femtovg", "unstable-winit-030"] }
jwalk = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rfd = "0.17.2"
strum = { version = "0.28.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
slint-build = "1.17.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

[target.'cfg(target_os = "linux")'.dependencies]
dirs = "6.0.0"

[profile.release]
opt-level = "z"
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"